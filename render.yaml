# Render Blueprint Configuration
# Deploy this as a Static Site on Render

services:
  - type: web
    name: driveshaft-cable-site
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /products/*
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /blog/*
        name: Content-Type
        value: text/html; charset=utf-8
    routes:
      - type: redirect
        source: /products/driveshaft-cable-plus
        destination: /products/driveshaft-cable
      - type: rewrite
        source: /cart/recover/:token
        destination: /cart/index.html
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
      - type: rewrite
        source: /admin/login
        destination: /admin/login/index.html
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /testimonial
        destination: /testimonial/index.html
      - type: rewrite
        source: /suggestions
        destination: /suggestions/index.html
      - type: rewrite
        source: /order-tracking
        destination: /order-tracking/index.html
      - type: rewrite
        source: /checkout/success
        destination: /checkout/success/index.html
      - type: rewrite
        source: /checkout
        destination: /checkout/index.html
      - type: rewrite
        source: /cart
        destination: /cart/index.html
      - type: rewrite
        source: /quote
        destination: /quote/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /instructions
        destination: /instructions/index.html
      - type: rewrite
        source: /faq
        destination: /faq/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      - type: rewrite
        source: /products
        destination: /products/index.html
      - type: rewrite
        source: /*
        destination: /index.html
